# General Playback Settings
loop-playlist=yes                        # Autoplay next video in the playlist
save-position-on-quit=yes                # Resume playback on quit
volume-max=380                           # Set maximum volume to 380%
af=lavfi=[alimiter=limit=0.97]           # Soft limiter to reduce clipping risk at high volume boost

# Subtitle Settings
sub-auto=fuzzy                           # Automatically load subtitle files
slang=jpn,ja,zho,chi,zh,rus,ru,por,pt,eng,en,spa,es  # Preferred subtitles with common alias codes
subs-match-os-language=no                # Do not override preferred subtitle order with system locale
subs-with-matching-audio=forced          # Prefer translation subs; only match audio language for forced tracks
sub-font="Noto Sans"                     # Default subtitle font
sub-scale=1.0                            # Resolution-consistent subtitle scaling
sub-color="#FFFFFF"                      # Subtitle color
sub-shadow-color="#000000"               # Subtitle shadow color
sub-border-size=2                        # Subtitle border size
sub-shadow-offset=2                      # Subtitle shadow offset
sub-ass-use-video-data=aspect-ratio      # Keep subtitles within video frame

# Audio Settings
alang=jpn,zh,rus,por,en,es               # Preferred audio languages

# Video Settings
hwdec=auto-copy                          # Use hardware decode with copy-back to avoid driver color glitches
scale=ewa_lanczossharp                   # Improve video scaling quality
cscale=ewa_lanczossharp                  # Scaling for chroma
interpolation=yes                        # Enable interpolation for smooth playback
tscale=mitchell                          # Balanced interpolation scaling for general video use
vo=gpu                                   # Change video output to GPU for smoother playback

# User Interface Settings
osc=yes                                  # Enable On-Screen Controller (OSC)
fullscreen=yes                           # Auto fullscreen on play

# Screenshot Settings
screenshot-directory="~/Pictures"         # Use existing directory for reliable saves
screenshot-template="mpv_shot_%F_%p_%02n" # Screenshot template with timestamp


# No borders for a cleaner look with tiling window managers
border=no  

# Debanding filter (for anime or low-bitrate videos)
deband=yes

# OSD Customization
osd-font="Noto Sans"                     # Explicit OSD font to avoid mixed fallback glyph sizes
osd-font-size=40                         # Set OSD font size
osd-color="#93b4ff"                      # Customize OSD color to bright 
osd-border-size=1.5                        # Set OSD border size for readability


############################################
############### Shortcuts ##################
############################################

# Press "J" to toggle through subtitle tracks

# Left arrow to rewind 5 seconds
# Right arrow to fast-forward 5 seconds
# Up arrow to skip forward 1 minute
# Down arrow to skip back 1 minute

# Press "F" to toggle fullscreen

# Press "M" to mute/unmute audio

# Press "S" to take a screenshot

# Press "V" to hide the subs

